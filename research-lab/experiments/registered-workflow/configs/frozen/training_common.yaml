training_common:
  status: frozen
  frozen_on: 2026-04-25
  scope: all primary datasets, models, splits, seeds, and checkpoint policies
  basis:
    - https://osf.io/avnp9 (Study Protocol Frozen v1.0)
    - research-lab/notes/2026-04-25_Pre_Execution_Issues_and_Freeze_Proposal.md

input:
  image_size: 224
  channels: 3
  grayscale_handling: convert_to_rgb_by_channel_repeat
  interpolation: bilinear

normalization:
  scheme: imagenet
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  common_train:
    random_resized_crop:
      enabled: true
      size: 224
      scale: [0.8, 1.0]
    rotation:
      enabled: true
      degrees: 10
  dataset_overrides:
    sipakmed:
      horizontal_flip:
        enabled: true
        p: 0.5
        rationale: Cytology images are not expected to have left-right anatomical label semantics.
    organamnist:
      horizontal_flip:
        enabled: false
        p: 0.0
        rationale: Abdominal CT organ labels may be orientation-sensitive; avoid semantic label changes.
  validation:
    resize: 224
    center_crop: null
  test:
    resize: 224
    center_crop: null

optimization:
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 32
  loss: cross_entropy
  scheduler:
    name: none

fine_tuning:
  initialization: imagenet
  trainable_scope: final_block_plus_classifier
  layer_wise_lr_decay: false
  model_specific_tuning: false

reproducibility:
  cudnn_deterministic: true
  cudnn_benchmark: false
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  dataloader_worker_seed_policy: worker_init_fn_based_on_global_seed
  dataloader_generator_policy: torch_generator_seeded_by_training_seed
  worker_seed_formula: "worker_seed = training_seed + worker_id"
  worker_seed_formula_note: >
    The same training-seed-derived worker seeds are intentionally reused across
    datasets, splits, models, and checkpoint policies to preserve the crossed
    seed design. Run identity must not be used to alter worker seeds unless an
    amendment is recorded.

notes:
  - Values are frozen as the common primary-analysis training configuration.
  - Horizontal flip is dataset-specific by frozen decision; do not enable it globally.
  - Any new dataset-specific exception requires decision logging before formal execution.
